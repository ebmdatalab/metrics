version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github_actions"

  - package-ecosystem: "docker"
    directories:
    - "grafana/"
    - "db/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Pin the PostgreSQL version.
      # We assume that our managed database will be updated
      # to the latest minor version automatically.
      # This allows us to keep reasonably in sync with that.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
