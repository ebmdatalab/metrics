---
name: Grafana deployment

env:
  IMAGE_NAME: grafana-grafana
  PUBLIC_IMAGE_NAME: ghcr.io/ebmdatalab/grafana
  REGISTRY: ghcr.io
  SSH_AUTH_SOCK: /tmp/agent.sock

on:
  workflow_dispatch:
  push:
    paths:
      - 'grafana/**'
      - '!grafana/README.md'

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  # v3.4.0
        with:
          dockerfile: grafana/Dockerfile

  docker-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17 # v1.7.0
        with:
          install-just: true

      - name: Build docker image
        run: |
            just grafana/build

      - name: Run smoke test
        run: |
          just grafana/serve
          sleep 5
          just grafana/smoke-test || { docker logs grafana-grafana_1; exit 1; }

      - name: Save docker image
        run: |
          docker save grafana-grafana | gzip > /tmp/grafana.tar.gz

      - name: Upload docker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
            name: grafana-image
            path: /tmp/grafana.tar.gz

  required-checks:
    if: always()

    needs:
    - docker-test-and-build
    - lint-dockerfile

    runs-on: Ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}

  deploy:
    needs: [required-checks]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    if: github.ref == 'refs/heads/main'

    concurrency: deploy-production-grafana

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opensafely-core/setup-action@d9171097dd0d37bdb7bed58f701eb03ff317ed17 # v1.7.0
        with:
          install-just: true

      - name: Download docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
            name: grafana-image
            path: /tmp/image

      - name: Import docker image
        run: gunzip -c /tmp/image/grafana.tar.gz | docker load

      - name: Test image we imported from previous job works
        run: |
            SKIP_BUILD=1 just grafana/serve
            sleep 5
            just grafana/smoke-test || { docker logs grafana-grafana_1; exit 1; }

      - name: Publish image
        run: |
            # if you want to do this manually, use a PAT (classic) with `write:packages`:
            # https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry#authenticating-with-a-personal-access-token-classic
            echo ${{ secrets.GITHUB_TOKEN }} | docker login "$REGISTRY" -u ${GITHUB_ACTOR} --password-stdin
            docker tag "$IMAGE_NAME" "$PUBLIC_IMAGE_NAME":latest
            docker push "$PUBLIC_IMAGE_NAME":latest

      - name: Deploy image
        run: |
            ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
            ssh-add - <<< "${{ secrets.DOKKU3_DEPLOY_SSH_KEY }}"
            SHA=$(docker inspect --format='{{join .RepoDigests "\n"}}' "$PUBLIC_IMAGE_NAME:latest" | grep "$PUBLIC_IMAGE_NAME")
            echo "Deploying $SHA to dokku3"
            ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" dokku@dokku3.ebmdatalab.net git:from-image grafana "$SHA"
